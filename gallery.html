<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --neon-pink: #ff71ce;
            --neon-blue: #01cdfe;
            --neon-green: #05ffa1;
            --neon-purple: #b967ff;
            --bg-color: #0f0f1b;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(255, 113, 206, 0.05) 25%, rgba(255, 113, 206, 0.05) 26%, transparent 27%, transparent 74%, rgba(255, 113, 206, 0.05) 75%, rgba(255, 113, 206, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(1, 205, 254, 0.05) 25%, rgba(1, 205, 254, 0.05) 26%, transparent 27%, transparent 74%, rgba(1, 205, 254, 0.05) 75%, rgba(1, 205, 254, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* Эффект старого телевизора (Scanlines) */
        body::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .container {
            max-width: 1200px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 3;
        }

        .header { text-align: center; margin-bottom: 50px; }
        .header h1 {
            font-size: 50px; margin: 0; text-transform: uppercase; letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink), 0 0 80px var(--neon-pink);
        }
        .header p { color: var(--neon-blue); font-size: 18px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 5px var(--neon-blue); }

        .stats-bar {
            display: flex; justify-content: space-around; background: rgba(0,0,0,0.6);
            border: 2px solid var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue);
            border-radius: 10px; padding: 20px; margin-bottom: 40px; text-align: center;
        }
        .stat-item h3 { margin: 0; font-size: 14px; color: var(--neon-purple); text-transform: uppercase; }
        .stat-item span { font-size: 36px; font-weight: bold; color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }

        .badge-card {
            background: rgba(20, 20, 30, 0.8); border-radius: 8px; padding: 20px; display: flex; align-items: center; gap: 15px;
            border: 1px solid #333; transition: all 0.3s ease; position: relative; overflow: hidden;
        }

        .badge-card.unlocked {
            border: 1px solid var(--neon-blue); box-shadow: 0 0 10px rgba(1, 205, 254, 0.3), inset 0 0 10px rgba(1, 205, 254, 0.1);
        }
        .badge-card.unlocked:hover {
            transform: translateY(-5px) scale(1.02); box-shadow: 0 0 20px var(--neon-pink), inset 0 0 15px rgba(255, 113, 206, 0.2);
            border-color: var(--neon-pink);
        }

        .icon { font-size: 40px; filter: grayscale(100%) opacity(0.3); transition: 0.3s; }
        .unlocked .icon { filter: drop-shadow(0 0 8px var(--neon-blue)) grayscale(0%) opacity(1); }
        .unlocked:hover .icon { filter: drop-shadow(0 0 12px var(--neon-pink)); }

        .info { flex: 1; display: flex; flex-direction: column; }
        .title { font-weight: bold; font-size: 16px; color: #555; text-transform: uppercase; margin-bottom: 5px; }
        .unlocked .title { color: #fff; text-shadow: 0 0 5px #fff; }
        .unlocked:hover .title { color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); }
        
        .desc { font-size: 12px; color: #444; line-height: 1.4; }
        .unlocked .desc { color: var(--neon-green); }

        /* Прогресс бар */
        .progress-container { width: 100%; background: #222; border-radius: 10px; margin: 20px 0 40px 0; border: 1px solid var(--neon-purple); overflow: hidden; height: 20px; position: relative; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink)); width: 0%; transition: width 1s ease-in-out; box-shadow: 0 0 15px var(--neon-pink); }
        .progress-text { position: absolute; width: 100%; text-align: center; top: 2px; font-size: 12px; font-weight: bold; color: white; text-shadow: 1px 1px 2px black; }
    </style>
</head>

            let unlockedKeys = Object.keys(stats.unlocked || {});
            let unlockedCount = unlockedKeys.length;
            let totalCount = Object.keys(BADGES).length;

            // Обновляем статистику
            document.getElementById('stat-count').innerText = `${unlockedCount}`;
            document.getElementById('stat-grades').innerText = `${stats.totalGrades || 0}`;

            document.getElementById('stat-streak').innerText = `${stats.streak || 0} 🔥`;

            // Обновляем прогресс-бар
            let percent = Math.round((unlockedCount / totalCount) * 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${unlockedCount} / ${totalCount} ЗАВЕРШЕНО (${percent}%)`;

            // Генерируем карточки
            const grid = document.getElementById('badges-grid');
            
            for (let key in BADGES) {
                let badge = BADGES[key];
                let isUnlocked = stats.unlocked && stats.unlocked[key];
                
                let card = document.createElement('div');
                card.className = `badge-card ${isUnlocked ? 'unlocked' : ''}`;
                
                let iconStr = isUnlocked ? badge.i : '❓';
                let titleStr = isUnlocked ? badge.t : 'Скрыто';
                let descStr = isUnlocked ? badge.d : 'Продолжайте работать в МЭШ, чтобы узнать, как открыть это достижение.';

                card.innerHTML = `

                    <div class="info">
                        <div class="title">${titleStr}</div>
                        <div class="desc">${descStr}</div>
                    </div>
                `;
                grid.appendChild(card);
